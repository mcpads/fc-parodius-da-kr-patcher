[workspace]
resolver = "2"
members = ["apps/nes_parodius_patch"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fontdue = "0.9"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
